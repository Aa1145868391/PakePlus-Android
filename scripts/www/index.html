<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>诊断</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#0f0;font:12px/1.5 monospace}
  #diag{padding:16px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="diag">…</div>
<script>
(function(){
  var d = document.getElementById('diag');
  var L = [];
  function log(s){ L.push(s); d.textContent = L.join('\n'); }

  log('=== 诊断开始 ===');
  try { log('URL: ' + location.href); } catch(e){ log('URL ERR: '+e.message); }
  try { log('protocol: ' + location.protocol); } catch(e){ log('protocol ERR'); }
  try { log('origin: ' + location.origin); } catch(e){ log('origin ERR'); }
  try { log('UA: ' + navigator.userAgent); } catch(e){ log('UA ERR'); }
  try { log('body exists: ' + !!document.body); } catch(e){ log('body ERR'); }
  try { log('view-list exists: ' + !!document.getElementById('view-list')); } catch(e){ log('view ERR'); }

  try {
    localStorage.setItem('__t','1');
    localStorage.removeItem('__t');
    log('localStorage: OK');
  } catch(e){ log('localStorage: ERR ' + e.name); }

  log('indexedDB type: ' + (typeof indexedDB));
  try {
    var req = indexedDB.open('__diag', 1);
    req.onsuccess = function(){ log('indexedDB open: OK'); try{ req.result.close(); indexedDB.deleteDatabase('__diag'); }catch(_){} };
    req.onerror   = function(){ log('indexedDB open: ERR ' + (req.error && req.error.name)); };
    req.onblocked = function(){ log('indexedDB open: BLOCKED'); };
    setTimeout(function(){ log('indexedDB open: TIMEOUT (>3s)'); }, 3000);
  } catch(e){
    log('indexedDB open: THROW ' + e.name + ' ' + e.message);
  }

  window.addEventListener('error', function(ev){
    log('[ERROR] ' + ev.message + ' @ ' + (ev.filename||'?') + ':' + ev.lineno);
  });
  window.addEventListener('unhandledrejection', function(ev){
    log('[REJECT] ' + ((ev.reason && (ev.reason.message || ev.reason.name)) || ev.reason));
  });

  log('--- 以上为同步阶段输出 ---');
  setTimeout(function(){
    log('--- 3 秒后 ---');
    try { log('body.children: ' + document.body.children.length); } catch(e){}
    try { log('window.innerHeight: ' + window.innerHeight); } catch(e){}
    try { log('window.innerWidth: ' + window.innerWidth); } catch(e){}
    log('=== 诊断结束 ===');
  }, 3000);
})();
</script>
</body>
</html>
